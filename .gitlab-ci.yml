stages:
  - security

security-scan:
  stage: security
  image: python:3.9
  script:
    - pip install -r requirements.txt
    - python -m sqli_detector scan . --verbose
  allow_failure: true
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
    paths:
      - security-report.txt
  only:
    - main
    - develop
    - merge_requests
